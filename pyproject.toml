[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pptviper"
version = "0.1.0"
description = "PPTX の見た目の問題を描画せずに検査する軽量ライブラリ"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/stellar-aiz/pptviper"
Issues = "https://github.com/stellar-aiz/pptviper/issues"

[project.scripts]
pptviper = "pptviper.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-socket>=0.7,<1",
  "python-pptx>=1,<2",
  "ruff>=0.11,<1",
  "pyright>=1.1.400,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pptviper"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
addopts = "--disable-socket -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
